<style>
/* 版面：便當店點餐台。左邊是轉盤（筷子當指針），右邊是出餐單＋篩選＋最近吃過；手機上下疊。 */
:root{
  --bg:#EDF1EA;        /* 淡青菜灰 */
  --surface:#FFFFFF;
  --surface-2:#F5F7F2;
  --ink:#2A211B;       /* 醬油色 */
  --muted:#6B6259;
  --line:#D6DBD0;
  --chili:#C63F29;     /* 辣椒紅＝主色 */
  --yolk:#EFB030;      /* 蛋黃 */
  --scallion:#4E8C3E;  /* 青蔥 */
  --salmon:#EE8B5E;    /* 鮭魚 */
  --nori:#2E4B3B;      /* 海苔 */
  --rice:#FBF6EA;      /* 白飯 */
  --wood:#A8733F;      /* 筷子 */
  --on-light:#2A211B;
  --on-dark:#FFFFFF;
  --dim:rgba(237,241,234,.62);
  --shadow:rgba(42,33,27,.12);
  --focus:#1F6FEB;
  --font-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14120F; --surface:#1F1C18; --surface-2:#191714; --ink:#F2ECE3; --muted:#A79D91; --line:#38332B;
    --chili:#E0553B; --yolk:#F0BC48; --scallion:#5FA34F; --salmon:#F09A72; --nori:#3B634D; --rice:#EFE6D2;
    --wood:#C99058; --on-light:#2A211B; --on-dark:#FFFFFF; --dim:rgba(20,18,15,.6); --shadow:rgba(0,0,0,.45);
    --focus:#6EA8FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14120F; --surface:#1F1C18; --surface-2:#191714; --ink:#F2ECE3; --muted:#A79D91; --line:#38332B;
  --chili:#E0553B; --yolk:#F0BC48; --scallion:#5FA34F; --salmon:#F09A72; --nori:#3B634D; --rice:#EFE6D2;
  --wood:#C99058; --on-light:#2A211B; --on-dark:#FFFFFF; --dim:rgba(20,18,15,.6); --shadow:rgba(0,0,0,.45);
  --focus:#6EA8FF; color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 40px;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.app{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

.top{display:flex;flex-direction:column;gap:4px}
.top h1{font-family:var(--font-display);font-weight:700;font-size:clamp(32px,6vw,46px);line-height:1.15;margin:0;letter-spacing:.03em;text-wrap:balance}
.top p{margin:0;color:var(--muted);max-width:40em}
.top b{color:var(--ink);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr);gap:24px}}

/* ── 轉盤 ── */
.wheel-col{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0;padding-top:22px}
.wheel-wrap{position:relative;width:min(100%,470px);aspect-ratio:1;max-width:100%}
.wheel-wrap::before{
  content:"";position:absolute;inset:-9px;border-radius:50%;
  background:var(--surface);box-shadow:0 0 0 1px var(--line),0 14px 34px var(--shadow);
}
#wheel{position:relative;z-index:1;width:100%;height:100%;display:block;border-radius:50%}
.pointer{
  position:absolute;z-index:3;left:50%;top:-34px;width:30px;height:74px;
  transform:translateX(-50%);transform-origin:50% 0;
  filter:drop-shadow(0 3px 3px var(--shadow));pointer-events:none;
}
.pointer.tick{animation:tick .13s ease-out}
@keyframes tick{0%{transform:translateX(-50%) rotate(0)}35%{transform:translateX(-50%) rotate(-9deg)}100%{transform:translateX(-50%) rotate(0)}}
.hub{
  position:absolute;z-index:2;left:50%;top:50%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;border:0;cursor:pointer;
  background:var(--ink);color:var(--bg);
  font-family:var(--font-display);font-weight:700;font-size:clamp(20px,5vw,28px);letter-spacing:.04em;
  box-shadow:0 0 0 6px var(--surface),0 6px 18px var(--shadow);
  transition:transform .15s ease;
}
.hub:hover{transform:translate(-50%,-50%) scale(1.05)}
.hub:active{transform:translate(-50%,-50%) scale(.96)}
.hub:disabled{cursor:progress;transform:translate(-50%,-50%)}
.hint{margin:0;color:var(--muted);font-size:13px;text-align:center;min-height:1.6em}

/* ── 出餐單 ── */
.side{display:flex;flex-direction:column;gap:26px;min-width:0}
.ticket{
  position:relative;background:var(--surface);border-radius:var(--radius);
  box-shadow:0 0 0 1px var(--line),0 10px 28px var(--shadow);
}
.ticket-body{padding:18px 22px 20px;display:flex;flex-direction:column;gap:6px}
.ticket-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
.ticket-no{font-variant-numeric:tabular-nums;letter-spacing:.06em}
.ticket-dish{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,7vw,40px);line-height:1.22;text-wrap:balance;margin:2px 0 0;overflow-wrap:anywhere}
.ticket-dish.idle{color:var(--muted)}
.ticket-meta{color:var(--muted);font-size:14px}
.ticket-actions{
  position:relative;border-top:2px dashed var(--line);
  padding:16px 22px 18px;display:flex;flex-wrap:wrap;gap:10px;
}
.ticket-actions::before,.ticket-actions::after{
  content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);
}
.ticket-actions::before{left:-11px;box-shadow:inset -1px 0 0 var(--line)}
.ticket-actions::after{right:-11px;box-shadow:inset 1px 0 0 var(--line)}
.pop{animation:pop .38s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(.94);opacity:.5}100%{transform:scale(1);opacity:1}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
  padding:9px 18px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--surface-2);color:var(--ink);font-weight:600;font-size:15px;
  cursor:pointer;text-decoration:none;
}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--chili);border-color:var(--chili);color:var(--on-dark)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line)}

/* ── 篩選 ── */
.block{display:flex;flex-direction:column;gap:10px}
.block h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:36px;padding:5px 13px;border-radius:999px;border:1.5px solid var(--line);
  background:transparent;cursor:pointer;font-size:14px;
}
.chip .n{margin-left:5px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.seg{display:inline-flex;align-self:flex-start;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 14px;min-height:34px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--yolk);color:var(--on-light);font-weight:700}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;align-self:flex-start}
.check input{width:18px;height:18px;accent-color:var(--chili)}
.count{font-size:13px;color:var(--muted)}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ── 最近吃過 ── */
.history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.history li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.history li:last-child{border-bottom:0}
.history .when{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.history .name{min-width:0;overflow-wrap:anywhere}
.empty{margin:0;color:var(--muted);font-size:14px}
.text-btn{border:0;background:none;color:var(--muted);font-size:13px;letter-spacing:0;cursor:pointer;padding:4px 6px;border-radius:6px;text-decoration:underline;text-underline-offset:3px}
.text-btn.armed{color:var(--chili);font-weight:700}

/* ── 全部菜單 ── */
.menu{border-top:1px solid var(--line);padding-top:8px}
.menu summary{cursor:pointer;font-weight:700;padding:10px 0;font-size:16px;list-style-position:inside}
.menu-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 14px}
.menu input[type="search"]{
  flex:1 1 220px;min-width:0;max-width:420px;min-height:42px;padding:8px 14px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;
}
.menu-group{margin:18px 0 0}
.menu-group h3{font-family:var(--font-display);font-size:22px;margin:0 0 4px}
.menu-group h3 span{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}
.menu-sub{margin:10px 0 0}
.menu-sub h4{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.menu-sub ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 16px}
.menu-sub li{font-size:14px}
.menu-sub li mark{background:var(--yolk);color:var(--on-light);border-radius:3px;padding:0 1px}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}

@media (prefers-reduced-motion: reduce){
  .pointer.tick,.pop{animation:none}
  .hub{transition:none}
}
</style>

<div class="app">
  <header class="top">
    <h1>今天吃什麼</h1>
    <p>從 <b>1,000</b> 道一人份的午餐、晚餐裡抽一道。每一道都是一個人點了就能吃飽的份量。轉到不想吃的，就再轉一次。</p>
  </header>

  <main class="grid">
    <section class="wheel-col" aria-label="轉盤">
      <div class="wheel-wrap" id="wheelWrap">
        <svg class="pointer" id="pointer" viewBox="0 0 30 74" aria-hidden="true">
          <rect x="4" y="0" width="7" height="72" rx="3.5" transform="rotate(-6 7.5 0)" fill="var(--wood)"/>
          <rect x="19" y="0" width="7" height="72" rx="3.5" transform="rotate(6 22.5 0)" fill="var(--wood)"/>
          <rect x="3" y="2" width="24" height="8" rx="3" fill="var(--chili)"/>
        </svg>
        <canvas id="wheel" role="img" aria-label="餐點轉盤"></canvas>
        <button class="hub" id="spinBtn" type="button">轉！</button>
      </div>
      <p class="hint" id="hint">點中間的「轉！」，或按空白鍵</p>
    </section>

    <section class="side">
      <div class="ticket" id="ticket" aria-live="polite">
        <div class="ticket-body">
          <div class="ticket-head"><span>今天就吃</span><span class="ticket-no" id="dishNo">No. ----</span></div>
          <p class="ticket-dish idle" id="dish">還沒轉</p>
          <div class="ticket-meta" id="dishMeta">每轉一次，盤上的 12 道都會重抽</div>
        </div>
        <div class="ticket-actions">
          <button class="btn primary" id="acceptBtn" type="button" disabled>就吃這個</button>
          <button class="btn" id="rerollBtn" type="button" disabled>不要，再轉</button>
          <a class="btn" id="mapLink" href="https://www.google.com/maps" target="_blank" rel="noopener" hidden>找附近的店 ↗</a>
        </div>
      </div>

      <div class="block">
        <h2>想吃哪一類</h2>
        <div class="chips" id="groupChips"></div>
        <div class="seg" id="kindSeg" role="group" aria-label="飯或麵">
          <button type="button" data-kind="all">不限</button>
          <button type="button" data-kind="飯">飯類</button>
          <button type="button" data-kind="麵">麵類</button>
          <button type="button" data-kind="其他">其他</button>
        </div>
        <label class="check"><input type="checkbox" id="avoidRecent"> 避開最近吃過的 7 道</label>
        <div class="count" id="poolCount"></div>
      </div>

      <div class="block">
        <h2><span>最近吃過</span><button class="text-btn" id="clearHist" type="button">清除紀錄</button></h2>
        <ol class="history" id="history"></ol>
        <p class="empty" id="historyEmpty">還沒有紀錄。轉到想吃的，按「就吃這個」就會記在這裡。</p>
      </div>
    </section>
  </main>

  <details class="menu" id="menu">
    <summary>看全部 1,000 道菜單</summary>
    <div class="menu-tools">
      <input type="search" id="menuSearch" placeholder="搜尋，例如：咖哩、拉麵、便當" aria-label="搜尋菜單">
      <span class="count" id="menuCount"></span>
    </div>
    <div id="menuList"></div>
  </details>

  <footer>「最近吃過」只存在你自己的瀏覽器裡。把網址分享給朋友，每個人的紀錄各自分開，不會互相看到。</footer>
</div>

<script>
(function(){
  'use strict';
  var TAU = Math.PI * 2;
  var GROUPS = ['台式','中式・港式','日式','韓式','東南亞','西式','異國風味','鍋物','輕食・素食'];
  var CANVAS_FONT = '"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── 資料 ── */
  function kindOf(name){
    var n = name.replace(/麵包/g, '');
    if (/麵|粉|米線|烏龍|蕎麥|粿條|粿仔條|粄條|米苔目|鼎邊|米干|叻沙|牛河|雞絲河|炒米|粗炒|刀削/.test(n)) return '麵';
    if (/飯|丼|便當|粥|米糕|碗粿|定食|粽|壽司|炊|手捲|卷|餐盒|健康餐/.test(n)) return '飯';
    if (/咖哩/.test(name) && !/烤餅|麵包|多薩/.test(name)) return '飯';
    return '其他';
  }
  var DISHES = [];
  (function parse(){
    var g = '', s = '';
    document.getElementById('dishes').textContent.split('\n').forEach(function(line){
      line = line.trim();
      if (!line || line.indexOf('/*') === 0) return;
      if (line.charAt(0) === '@'){ var p = line.slice(1).split('|'); g = p[0]; s = p[1] || ''; return; }
      DISHES.push({ no: DISHES.length + 1, name: line, group: g, sub: s, kind: kindOf(line) });
    });
  })();

  /* ── 狀態（只存在這台瀏覽器） ── */
  var KEY = 'today-eat-v1';
  var state = { groups: [], kind: 'all', avoid: true, history: [] };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved === 'object'){
      if (Array.isArray(saved.groups)) state.groups = saved.groups.filter(function(g){ return GROUPS.indexOf(g) >= 0; });
      if (['all','飯','麵','其他'].indexOf(saved.kind) >= 0) state.kind = saved.kind;
      if (typeof saved.avoid === 'boolean') state.avoid = saved.avoid;
      if (Array.isArray(saved.history)) state.history = saved.history.filter(function(h){ return h && typeof h.n === 'string' && typeof h.t === 'number'; }).slice(0, 30);
    }
  } catch (e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  var vetoed = {};   // 這次打開頁面時按過「不要」的

  function basePool(){
    return DISHES.filter(function(d){
      return (!state.groups.length || state.groups.indexOf(d.group) >= 0) && (state.kind === 'all' || d.kind === state.kind);
    });
  }
  function recentSet(){
    var r = {};
    if (state.avoid) state.history.slice(0, 7).forEach(function(h){ r[h.n] = 1; });
    return r;
  }
  function pool(){
    var r = recentSet();
    return basePool().filter(function(d){ return !vetoed[d.name] && !r[d.name]; });
  }
  function sample(arr, k){
    var a = arr.slice(), n = a.length, out = [];
    for (var i = 0; i < k && i < n; i++){
      var j = i + Math.floor(Math.random() * (n - i));
      var t = a[i]; a[i] = a[j]; a[j] = t; out.push(a[i]);
    }
    return out;
  }
  function mod(a, m){ return ((a % m) + m) % m; }
  function shortName(n){ return n.replace(/（[^）]*）/g, ''); }

  /* ── 轉盤 ── */
  var cv = document.getElementById('wheel');
  var ctx = cv.getContext('2d');
  var wrap = document.getElementById('wheelWrap');
  var pointer = document.getElementById('pointer');
  var slices = [], rot = 0, spinning = false, winIdx = -1, dpr = 1;

  function palette(){
    var cs = getComputedStyle(document.documentElement);
    function v(k){ return cs.getPropertyValue(k).trim(); }
    return {
      pairs: [[v('--chili'), v('--on-dark')], [v('--yolk'), v('--on-light')], [v('--scallion'), v('--on-dark')],
              [v('--salmon'), v('--on-light')], [v('--nori'), v('--on-dark')], [v('--rice'), v('--on-light')]],
      dim: v('--dim'), line: v('--surface')
    };
  }
  function palIdx(i, n){
    if (n > 1 && i === n - 1 && (n - 1) % 6 === 0) return 2;  // 避免頭尾同色相鄰
    return i % 6;
  }
  function fit(text, maxW){
    if (ctx.measureText(text).width <= maxW) return text;
    var t = text;
    while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t + '…';
  }
  function resize(){
    var r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    draw();
  }
  function draw(){
    var W = cv.width, R = W / 2, n = slices.length;
    ctx.clearRect(0, 0, W, W);
    if (!n) return;
    var seg = TAU / n, pal = palette();
    var fs = Math.max(11 * dpr, Math.min(R * 0.08, 18 * dpr));
    ctx.save();
    ctx.translate(R, R);
    ctx.rotate(rot);
    for (var i = 0; i < n; i++){
      var a0 = i * seg - Math.PI / 2, pair = pal.pairs[palIdx(i, n)];
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, a0, a0 + seg); ctx.closePath();
      ctx.fillStyle = pair[0]; ctx.fill();
      if (n > 1){ ctx.lineWidth = Math.max(1, dpr * 1.5); ctx.strokeStyle = pal.line; ctx.stroke(); }
      ctx.save();
      ctx.rotate(a0 + seg / 2);
      ctx.font = '700 ' + fs + 'px ' + CANVAS_FONT;
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillStyle = pair[1];
      ctx.fillText(fit(shortName(slices[i].name), R * 0.64), R - R * 0.07, 0);
      ctx.restore();
    }
    if (winIdx >= 0 && !spinning && n > 1){
      for (var j = 0; j < n; j++){
        if (j === winIdx) continue;
        var b0 = j * seg - Math.PI / 2;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, b0, b0 + seg); ctx.closePath();
        ctx.fillStyle = pal.dim; ctx.fill();
      }
    }
    ctx.restore();
  }
  function loadGlyphs(){
    if (!document.fonts || !document.fonts.load) return;
    var txt = slices.map(function(d){ return d.name; }).join('') + '…';
    document.fonts.load('700 16px "LXGW WenKai TC"', txt).then(function(){ if (!spinning) draw(); }).catch(function(){});
  }
  function fillWheel(){
    var p = pool();
    if (!p.length) p = basePool();
    slices = sample(p, Math.min(12, p.length));
  }
  function idxUnderPointer(){
    var n = slices.length; if (!n) return -1;
    return Math.floor(mod(-rot, TAU) / (TAU / n)) % n;
  }
  function tick(){
    if (reduceMotion) return;
    pointer.classList.remove('tick'); void pointer.getBoundingClientRect(); pointer.classList.add('tick');
  }

  /* ── 介面 ── */
  var $ = function(id){ return document.getElementById(id); };
  var spinBtn = $('spinBtn'), acceptBtn = $('acceptBtn'), rerollBtn = $('rerollBtn'), mapLink = $('mapLink');
  var dishEl = $('dish'), metaEl = $('dishMeta'), noEl = $('dishNo'), hint = $('hint'), ticket = $('ticket');
  var current = null;

  function mapQuery(d){
    if (/自己煮|學餐/.test(d.name)) return null;
    if (/^超商/.test(d.name)) return '便利商店';
    return shortName(d.name).split('＋')[0].replace(/^(個人|一人份)/, '').trim();
  }

  function spin(){
    if (spinning) return;
    var p = pool(), note = '';
    if (!p.length){
      if (!basePool().length){ hint.textContent = '這個組合沒有餐點，換個分類試試。'; return; }
      vetoed = {};
      p = pool();
      note = '這一類你都說過不要了，重新開始抽。';
      if (!p.length){ p = basePool(); note = '這一類都吃過了，這次不避開最近吃過的。'; }
    }
    var target = p[Math.floor(Math.random() * p.length)];
    // 用 target 所在的池子組 12 格
    var others = sample(p.filter(function(d){ return d !== target; }), Math.min(12, p.length) - 1);
    var k = Math.floor(Math.random() * (others.length + 1));
    others.splice(k, 0, target);
    slices = others;
    loadGlyphs();
    var n = slices.length, seg = TAU / n;
    var landing = (k + 0.5) * seg + (Math.random() - 0.5) * 0.7 * seg;
    var delta = mod(mod(-landing, TAU) - mod(rot, TAU), TAU);
    var final = rot + (reduceMotion ? 1 : 6) * TAU + delta;
    var dur = reduceMotion ? 700 : 4200;

    spinning = true; winIdx = -1; current = null;
    spinBtn.disabled = true; spinBtn.textContent = '…';
    acceptBtn.disabled = true; rerollBtn.disabled = true; mapLink.hidden = true;
    dishEl.textContent = '轉轉轉……'; dishEl.classList.add('idle');
    metaEl.textContent = '從 ' + p.length.toLocaleString() + ' 道裡抽';
    noEl.textContent = 'No. ----';
    hint.textContent = note || ' ';

    var start = rot, t0 = performance.now(), last = idxUnderPointer();
    function frame(now){
      var t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 4);
      rot = start + (final - start) * e;
      draw();
      var idx = idxUnderPointer();
      if (idx !== last){ last = idx; tick(); }
      if (t < 1){ requestAnimationFrame(frame); return; }
      rot = mod(final, TAU);
      spinning = false; winIdx = idxUnderPointer();
      draw();
      showResult(slices[winIdx]);
    }
    requestAnimationFrame(frame);
  }

  function showResult(d){
    current = d;
    dishEl.textContent = d.name; dishEl.classList.remove('idle');
    metaEl.textContent = d.group + '・' + d.sub;
    noEl.textContent = 'No. ' + String(d.no).padStart(4, '0') + ' / 1000';
    var q = mapQuery(d);
    if (q){ mapLink.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); mapLink.hidden = false; }
    else mapLink.hidden = true;
    spinBtn.disabled = false; spinBtn.textContent = '再轉';
    acceptBtn.disabled = false; rerollBtn.disabled = false;
    ticket.classList.remove('pop'); void ticket.getBoundingClientRect(); ticket.classList.add('pop');
    var tr = ticket.getBoundingClientRect();
    if (tr.bottom > window.innerHeight) ticket.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
    updateCount();
  }

  acceptBtn.addEventListener('click', function(){
    if (!current) return;
    state.history.unshift({ n: current.name, t: Date.now() });
    state.history = state.history.slice(0, 30);
    save(); renderHistory(); updateCount();
    acceptBtn.disabled = true;
    hint.textContent = state.avoid ? '記下了。接下來幾次會先避開它。' : '記下了，祝用餐愉快。';
  });
  rerollBtn.addEventListener('click', function(){
    if (!current) return;
    vetoed[current.name] = 1;
    spin();
  });
  spinBtn.addEventListener('click', spin);
  document.addEventListener('keydown', function(e){
    if ((e.code === 'Space' || e.key === ' ') && (e.target === document.body || e.target === document.documentElement)){
      e.preventDefault(); spin();
    }
  });

  /* 篩選 */
  var chipsEl = $('groupChips'), segEl = $('kindSeg'), avoidEl = $('avoidRecent');
  function renderChips(){
    var counts = {};
    DISHES.forEach(function(d){ counts[d.group] = (counts[d.group] || 0) + 1; });
    var html = '<button type="button" class="chip" data-g="" aria-pressed="' + (!state.groups.length) + '">全部<span class="n">' + DISHES.length.toLocaleString() + '</span></button>';
    GROUPS.forEach(function(g){
      html += '<button type="button" class="chip" data-g="' + g + '" aria-pressed="' + (state.groups.indexOf(g) >= 0) + '">' + g + '<span class="n">' + (counts[g] || 0) + '</span></button>';
    });
    chipsEl.innerHTML = html;
    Array.prototype.forEach.call(segEl.querySelectorAll('button'), function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-kind') === state.kind));
    });
    avoidEl.checked = state.avoid;
  }
  function filtersChanged(){
    save(); renderChips(); updateCount();
    if (!spinning){ winIdx = -1; fillWheel(); loadGlyphs(); draw(); }
  }
  chipsEl.addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if (!b) return;
    var g = b.getAttribute('data-g');
    if (!g) state.groups = [];
    else {
      var i = state.groups.indexOf(g);
      if (i >= 0) state.groups.splice(i, 1); else state.groups.push(g);
      if (state.groups.length === GROUPS.length) state.groups = [];
    }
    filtersChanged();
  });
  segEl.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    state.kind = b.getAttribute('data-kind'); filtersChanged();
  });
  avoidEl.addEventListener('change', function(){ state.avoid = avoidEl.checked; filtersChanged(); });

  function updateCount(){
    var base = basePool().length, p = pool().length;
    var txt = '現在會從 <b>' + p.toLocaleString() + '</b> 道裡抽';
    if (p < base) txt += '（已扣掉 ' + (base - p) + ' 道最近吃過或按過不要的）';
    if (!base) txt = '這個組合沒有餐點，換個分類試試。';
    $('poolCount').innerHTML = txt;
  }

  /* 最近吃過 */
  function when(t){
    var d = new Date(t), now = new Date();
    var hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    var day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    if (t >= day0) return '今天 ' + hm;
    if (t >= day0 - 864e5) return '昨天 ' + hm;
    return (d.getMonth() + 1) + '/' + d.getDate();
  }
  function esc(s){ return s.replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function renderHistory(){
    var list = state.history.slice(0, 10);
    $('history').innerHTML = list.map(function(h){
      return '<li><span class="name">' + esc(h.n) + '</span><span class="when">' + when(h.t) + '</span></li>';
    }).join('');
    $('historyEmpty').hidden = list.length > 0;
    $('clearHist').hidden = list.length === 0;
  }
  var clearBtn = $('clearHist'), armTimer = null;
  clearBtn.addEventListener('click', function(){
    if (!clearBtn.classList.contains('armed')){
      clearBtn.classList.add('armed'); clearBtn.textContent = '再按一次確定清除';
      clearTimeout(armTimer);
      armTimer = setTimeout(function(){ clearBtn.classList.remove('armed'); clearBtn.textContent = '清除紀錄'; }, 3000);
      return;
    }
    clearTimeout(armTimer);
    clearBtn.classList.remove('armed'); clearBtn.textContent = '清除紀錄';
    state.history = []; save(); renderHistory(); updateCount();
  });

  /* 全部菜單 */
  var menuBuilt = false;
  function buildMenu(q){
    q = (q || '').trim();
    var html = '', total = 0, byGroup = {};
    DISHES.forEach(function(d){
      if (q && d.name.indexOf(q) < 0) return;
      (byGroup[d.group] = byGroup[d.group] || {});
      (byGroup[d.group][d.sub] = byGroup[d.group][d.sub] || []).push(d);
      total++;
    });
    GROUPS.forEach(function(g){
      var subs = byGroup[g]; if (!subs) return;
      var cnt = 0, inner = '';
      Object.keys(subs).forEach(function(s){
        cnt += subs[s].length;
        inner += '<div class="menu-sub"><h4>' + esc(s) + '</h4><ul>' + subs[s].map(function(d){
          var nm = esc(d.name);
          if (q){ var eq = esc(q); nm = nm.split(eq).join('<mark>' + eq + '</mark>'); }
          return '<li>' + nm + '</li>';
        }).join('') + '</ul></div>';
      });
      html += '<section class="menu-group"><h3>' + esc(g) + '<span>' + cnt + ' 道</span></h3>' + inner + '</section>';
    });
    $('menuList').innerHTML = html || '<p class="empty">找不到含「' + esc(q) + '」的餐點。</p>';
    $('menuCount').textContent = q ? '找到 ' + total + ' 道' : '共 ' + total.toLocaleString() + ' 道';
  }
  $('menu').addEventListener('toggle', function(){ if (this.open && !menuBuilt){ menuBuilt = true; buildMenu(''); } });
  $('menuSearch').addEventListener('input', function(){ menuBuilt = true; buildMenu(this.value); });

  /* 啟動 */
  renderChips(); renderHistory(); updateCount();
  fillWheel();
  resize();
  loadGlyphs();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (!spinning) draw(); });
  if (window.ResizeObserver) new ResizeObserver(function(){ resize(); }).observe(wrap);
  else window.addEventListener('resize', resize);
  if (window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', draw);
  }
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
